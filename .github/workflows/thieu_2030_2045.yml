name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Chuẩn bị thư mục www
        run: |
          test -f Thieu_2030_2045.html || { echo "Thiếu file Thieu_2030_2045.html ở thư mục gốc"; exit 1; }
          mkdir -p www
          cp Thieu_2030_2045.html www/index.html

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Tạo dự án Android
        run: npx cap add android

      - name: Đồng bộ (tạo biểu tượng app)
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Đưa APK lên mục Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Thieu_2030_2045-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
