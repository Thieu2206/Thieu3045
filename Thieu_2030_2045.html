<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#1f5f8b"><meta name="mobile-web-app-capable" content="yes">
<title>Kế hoạch cuộc đời Thiệu</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1d1b;--mut:#6b6a66;--line:#dedcd6;--acc:#1f5f8b;--acc2:#e7f1fb;--ok:#2e7d32;--warn:#b26a00;--bad:#b3261e;--yel:#fff8d6}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171716;--card:#222220;--ink:#ecebe6;--mut:#a3a29c;--line:#3a3a36;--acc:#7db7e3;--acc2:#1d2c3a;--ok:#7fcf84;--warn:#f0b35a;--bad:#ff8a80;--yel:#3a3620}}
:root[data-theme=dark]{--bg:#171716;--card:#222220;--ink:#ecebe6;--mut:#a3a29c;--line:#3a3a36;--acc:#7db7e3;--acc2:#1d2c3a;--ok:#7fcf84;--warn:#f0b35a;--bad:#ff8a80;--yel:#3a3620}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
h1{font-size:18px;margin:0}
.save{font-size:13px;color:var(--mut)}
.save b{color:var(--ink)}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
nav button{border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:1180px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.card h2{font-size:16px;margin:0 0 8px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stat{background:var(--acc2);border-radius:10px;padding:12px}
.stat .n{font-size:24px;font-weight:600}
.stat .l{color:var(--mut);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{background:var(--acc2);font-weight:600}
.tw{overflow-x:auto}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:4px 6px;max-width:100%}
input[type=number]{width:96px}input[type=date]{width:140px}
textarea{width:100%;min-height:44px}
td input[type=text],td textarea{width:100%}
.btn{border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.sm{padding:2px 8px;font-size:13px}
.btn.del{border-color:var(--bad);color:var(--bad);background:transparent}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.muted{color:var(--mut);font-size:13px}
.banner{background:var(--yel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.warn{color:var(--warn);font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.fld{display:flex;flex-direction:column;font-size:13px;color:var(--mut)}
.fld input,.fld select{color:var(--ink)}
.two{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
svg text{fill:var(--mut);font-size:11px}
.tw table{min-width:820px}td textarea{min-width:180px}td input[type=text]{min-width:140px}
@media (max-width:600px){main{padding:10px}header{position:static}}

:root{--accfill:#1f5f8b;--cdone:#cfead6;--cdoneink:#14532d}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--cdone:#264a31;--cdoneink:#d3f3dc}}
:root[data-theme=dark]{--cdone:#264a31;--cdoneink:#d3f3dc}
.btn{background:var(--accfill);border-color:var(--accfill)}.btn.ghost{background:transparent}
.btn.del{background:transparent}
nav button{display:inline-flex;align-items:center;gap:6px}
nav button.on{background:var(--accfill);border-color:var(--accfill)}
.ic{vertical-align:-3px;flex:none}
.card{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.hi{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;color:#fff;margin-right:8px;vertical-align:middle}
.card h2{display:flex;align-items:center}
.h3{font-size:14px;margin:6px 0}
.hero{position:relative;border-radius:14px;overflow:hidden;margin-bottom:14px;color:#fff;border:1px solid var(--line)}
.hero svg{display:block}.hero{background:#1b4f7a}@media (max-width:700px){.herotxt{position:static!important;max-width:none!important;padding:12px 14px 0}.hero{display:flex;flex-direction:column}.herotxt{order:-1}.hl{font-size:16px}.hl2{font-size:13px}}
.hero text{fill:#fff}
.hl{font-size:13px;font-weight:700;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:3px}
.hl2{font-size:11px;paint-order:stroke;stroke:rgba(0,0,0,.45);stroke-width:3px}
.herotxt{position:absolute;left:18px;top:14px;max-width:min(520px,70%);text-shadow:0 1px 6px rgba(0,0,0,.45)}
.hk{font-size:24px;font-weight:700}.hs{font-size:14px;margin-top:4px}
.pulse{animation:pulse 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.8}100%{transform:scale(1.8);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse,.card{animation:none}.ringarc{transition:none}}
.stat{display:flex;gap:12px;align-items:center}
.si{display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:12px;color:#fff;flex:none}
.fbadge{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:8px;color:#fff;margin-bottom:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;gap:4px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:2px 10px;font-size:13px}
.rings{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-around;margin:10px 0}
.ringw{text-align:center}.rsub{font-size:12px;color:var(--mut);margin-top:2px;max-width:110px}
svg text.rt{fill:var(--ink);font-size:20px;font-weight:700}
svg text.rl{font-size:13px;font-weight:700;stroke:none}
svg text.tl,svg text.ln,svg text.cl,svg text.bv{fill:var(--ink);font-weight:600}
svg text.ln{fill:#fff;font-size:11px}
svg text.cn{fill:#fff;font-size:18px;font-weight:700}
svg text.cc{fill:var(--ink);font-size:22px;font-weight:700}
svg text.cl{font-size:12px}
.ringarc{transition:stroke-dashoffset .8s ease}
.flow{display:flex;flex-wrap:wrap;gap:0}
.chev{flex:1 1 150px;min-width:140px;padding:10px 22px 10px 26px;background:var(--acc2);margin-right:-8px;display:flex;flex-direction:column;
 clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%,16px 50%)}
.chev:first-child{padding-left:14px;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 50%,calc(100% - 16px) 100%,0 100%)}
.chev b{font-size:13px}.chev span{font-size:12px;opacity:.85}
.chev.done{background:var(--cdone);color:var(--cdoneink)}
.chev.now{background:var(--accfill);color:#fff}
.pri{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.pr{display:flex;gap:10px;align-items:center}
.legend{display:flex;gap:14px;justify-content:center;font-size:13px;color:var(--mut)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.two{align-items:start}.gate{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}

@media (max-width:760px){
 html{-webkit-text-size-adjust:100%}
 input,select,textarea{font-size:16px!important;min-height:40px}
 .btn,nav button{min-height:40px}
 .top{gap:6px}
 nav{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -4px 14px rgba(0,0,0,.12);-webkit-overflow-scrolling:touch}
 nav button{flex:0 0 auto;flex-direction:column;gap:2px;padding:6px 10px;font-size:11px;border:0;border-radius:10px;background:transparent;color:var(--mut)}
 nav button.on{background:var(--accfill);color:#fff}
 main{padding-bottom:90px}
 .card{padding:12px}
}
@media (min-width:761px) and (max-width:1100px){main{max-width:none}.two{grid-template-columns:1fr 1fr}}

.dm{display:inline-block;position:relative}
.dm summary{list-style:none;cursor:pointer}.dm summary::-webkit-details-marker{display:none}
.dmi{position:absolute;right:0;top:calc(100% + 6px);z-index:60;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:210px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.dmi .btn{text-align:left}.dmi p{margin:0;font-size:12px;color:var(--mut)}
.toast{position:fixed;left:12px;right:12px;bottom:84px;z-index:90;background:#14532d;color:#fff;padding:12px 14px;border-radius:12px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
@media (max-width:760px){
 header{padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
 h1{font-size:17px}
 .save{font-size:12px}
 .tw{overflow:visible}
 .tw table{min-width:0!important}
 table,tbody{display:block;width:100%}
 tr.hrow{display:none}
 tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;margin:0 0 10px;padding:6px 12px}
 td{display:flex;flex-direction:column;gap:2px;border:0!important;padding:6px 0;width:auto}
 td[data-label]:not([data-label=""])::before{content:attr(data-label);font-size:12px;color:var(--mut);font-weight:600}
 td textarea,td input[type=text],td input[type=number],td input[type=date],td select{min-width:0!important;width:100%}
 td input[type=checkbox]{width:auto}
 td:empty{display:none}
 .fld{display:flex;flex-direction:column;width:100%}.fld input,.fld select{width:100%!important}
 .row{gap:8px}
 .grid{grid-template-columns:1fr 1fr!important}
 .stat{padding:10px}.stat .n{font-size:22px}
}
</style>

<script>
"use strict";
const SEED = JSON.parse(document.getElementById('seed').textContent);
const LS_KEY = 'thieu_plan_data_v1';
const TABS = [['tong','Tổng quan'],['muctieu','Mục tiêu'],['tuan','Theo dõi tuần'],['lotrinh','Lộ trình và cổng'],['innofire','INNO FIRE'],['tiensi','Tiến sĩ và viện'],['taichinh','Tài chính'],['mo','Việc còn mở']];
const FACTORS = ['Thân','Tâm','Tôi','Thấu','Tiến','Tầm','Tiền'];
let data = null, tab = localStorage.getItem('thieu_tab')||'tong';
let dirHandle = null, saveState = {mode:'tạm trong trình duyệt', last:null, err:null}, saveTimer = null;

/* ---------- helpers ---------- */
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const x = parseFloat(v); return isNaN(x)?0:x; };
const fmt = (v,d=2) => (isFinite(v)?v:0).toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d});
const today = () => new Date();
const iso = d => d.toISOString().slice(0,10);
function mondayOf(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return iso(new Date(x.getTime()-x.getTimezoneOffset()*60000));}
function daysTo(s){ if(!s) return null; const t=new Date(s+'T00:00:00'); const n=new Date(); n.setHours(0,0,0,0); return Math.round((t-n)/86400000); }
function getPath(o,p){return p.split('.').reduce((a,k)=>a==null?a:a[k],o);}
function setPath(o,p,v){const ks=p.split('.');let a=o;for(let i=0;i<ks.length-1;i++)a=a[ks[i]];a[ks[ks.length-1]]=v;}
function uid(){return Math.random().toString(36).slice(2,9);}

/* ---------- storage ---------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('thieu_plan',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbGet(k){try{const d=await idb();return await new Promise((res,rej)=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}catch(e){return null;}}
async function idbSet(k,v){try{const d=await idb();await new Promise((res,rej)=>{const q=d.transaction('kv','readwrite').objectStore('kv').put(v,k);q.onsuccess=()=>res();q.onerror=()=>rej(q.error);});}catch(e){}}
const hasFS = typeof window.showDirectoryPicker === 'function';
/* ---------- native (Capacitor / APK) ---------- */
const CAP=window.Capacitor, NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
const NP=n=>(NATIVE&&CAP.Plugins&&CAP.Plugins[n])||null;
async function nativeRead(name){try{const r=await NP('Filesystem').readFile({path:name,directory:'DATA',encoding:'utf8'});return typeof r.data==='string'?r.data:null;}catch(e){return null;}}
async function nativeWrite(name,text){await NP('Filesystem').writeFile({path:name,data:text,directory:'DATA',encoding:'utf8',recursive:true});}
function toast(msg){const d=document.createElement('div');d.className='toast';d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),5000);}
function labelTables(){
  document.querySelectorAll('#main table').forEach(tb=>{
    const rows=[...tb.querySelectorAll('tr')]; if(!rows.length) return;
    const heads=[...rows[0].querySelectorAll('th')].map(h=>h.textContent.trim());
    if(!heads.length) return;
    rows[0].classList.add('hrow');
    rows.slice(1).forEach(r=>[...r.children].forEach((c,i)=>{ if(c.tagName==='TD') c.setAttribute('data-label',heads[i]||''); }));
  });
}


function normalize(d){
  const base = JSON.parse(JSON.stringify(SEED));
  if(!d || typeof d!=='object') return base;
  for(const k of Object.keys(base)) if(!(k in d)) d[k]=base[k];
  return d;
}
async function writeDir(name,text){
  const fh = await dirHandle.getFileHandle(name,{create:true});
  const w = await fh.createWritable(); await w.write(text); await w.close();
}
async function saveNow(){
  data.meta.updated = new Date().toISOString();
  const text = JSON.stringify(data,null,2);
  try{ localStorage.setItem(LS_KEY,text); }catch(e){}
  if(dirHandle){
    try{ await writeDir('data.json',text); saveState={mode:'thư mục đã chọn',last:new Date(),err:null}; }
    catch(e){ saveState={mode:'thư mục đã chọn',last:saveState.last,err:'Không ghi được: '+e.message}; }
  } else if(NATIVE&&NP('Filesystem')){
    try{ await nativeWrite('data.json',text); saveState={mode:'bộ nhớ máy',last:new Date(),err:null}; }
    catch(e){ saveState={mode:'trình duyệt (lỗi ghi file)',last:saveState.last,err:'Không ghi được vào bộ nhớ máy: '+e.message}; }
  } else saveState={mode:'tạm trong trình duyệt',last:new Date(),err:null};
  paintSave();
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,400); }
function paintSave(){
  const el=document.getElementById('saveinfo'); if(!el) return;
  const wasOpen=!!el.querySelector('details.dm[open]');
  let h='';
  if(saveState.err) h+='<span class="bad">'+esc(saveState.err)+'</span> ';
  h+='Lưu: <b>'+esc(saveState.mode)+'</b>'+(saveState.last?' lúc '+saveState.last.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}):'')+' ';
  h+='<details class="dm"'+(wasOpen?' open':'')+'><summary class="btn sm ghost">Dữ liệu</summary><div class="dmi">';
  if(hasFS) h+='<button class="btn sm ghost" data-act="pickdir">'+(dirHandle?'Đổi thư mục':'Chọn thư mục dữ liệu')+'</button>';
  h+='<button class="btn sm ghost" data-act="export">'+(NATIVE?'Sao lưu / chia sẻ file':'Xuất JSON')+'</button><button class="btn sm ghost" data-act="import">Nhập JSON</button><button class="btn sm ghost" data-act="theme">Sáng/Tối</button>';
  if(NATIVE) h+='<p>Dữ liệu nằm trong bộ nhớ của app. Gỡ app sẽ xóa dữ liệu, hãy sao lưu trước.</p>';
  h+='</div></details>';
  el.innerHTML=h;
}
async function loadFromDir(){
  try{
    const fh = await dirHandle.getFileHandle('data.json');
    const text = await (await fh.getFile()).text();
    data = normalize(JSON.parse(text));
    try{ await writeDir('data.backup.json',text); }catch(e){}
    saveState={mode:'thư mục đã chọn',last:new Date(),err:null};
  }catch(e){
    if(e && e.name==='NotFoundError'){ saveState={mode:'thư mục đã chọn',last:null,err:null}; await saveNow(); }
    else { saveState.err='Không đọc được data.json: '+e.message; }
  }
}
async function pickDir(){
  try{
    dirHandle = await window.showDirectoryPicker({mode:'readwrite'});
    await idbSet('dir',dirHandle);
    await loadFromDir(); render();
  }catch(e){ if(e.name!=='AbortError'){ saveState.err=e.message; paintSave(); } }
}
async function init(){
  let local=null; try{ local=JSON.parse(localStorage.getItem(LS_KEY)||'null'); }catch(e){}
  data = normalize(local);
  if(NATIVE&&NP('Filesystem')){
    let txt=await nativeRead('data.json'), loaded=false;
    if(txt){ try{ data=normalize(JSON.parse(txt)); loaded=true; }catch(e){ const bk=await nativeRead('data.backup.json'); if(bk){ try{ data=normalize(JSON.parse(bk)); loaded=true; toast('File dữ liệu bị lỗi, đã khôi phục từ bản dự phòng.'); }catch(e2){} } } }
    if(loaded){ try{ await nativeWrite('data.backup.json',JSON.stringify(data,null,2)); }catch(e){} saveState={mode:'bộ nhớ máy',last:new Date(),err:null}; }
    else { await saveNow(); toast('Đã tự tạo cơ sở dữ liệu trên máy. Mọi thay đổi được lưu tự động.'); }
    try{ const A=NP('App'); if(A) A.addListener('backButton',()=>{ if(tab!=='tong'){ tab='tong'; localStorage.setItem('thieu_tab',tab); render(); window.scrollTo(0,0); } else A.exitApp(); }); }catch(e){}
    try{ const S=NP('StatusBar'); if(S){ S.setBackgroundColor({color:'#1f5f8b'}); S.setStyle({style:'DARK'}); } }catch(e){}
  }
  if(hasFS){
    const h = await idbGet('dir');
    if(h){
      try{
        let p = await h.queryPermission({mode:'readwrite'});
        if(p==='granted'){ dirHandle=h; await loadFromDir(); }
        else { saveState.err='Bấm "Chọn thư mục dữ liệu" để cấp lại quyền ghi vào thư mục đã chọn trước đó.'; }
      }catch(e){}
    }
  }
  render();
}

/* ---------- finance model (cùng công thức với file Excel) ---------- */
function annuity(r,N){ return Math.abs(r)<1e-6 ? N : (1-Math.pow(1+r,-N))/r*(1+r); }
function fin(f,sc){
  const age = f.year - SEED.profile.birthYear;
  const n = f.stopAge - age, N = f.planAge - f.stopAge;
  const stopYear = f.year + n;
  const real = (1+sc.nom)/(1+sc.inf)-1;
  const spend = f.spend*f.spendAfter*sc.spendMult;
  const af = annuity(real,N);
  const need = spend*af + f.illness;
  const needNom = need*Math.pow(1+sc.inf,n);
  const A = f.assets*Math.pow(1+sc.nom,n);
  const S = Math.abs(sc.nom)<1e-6 ? f.save*n : f.save*(Math.pow(1+sc.nom,n)-1)/sc.nom;
  const value = f.profit*sc.mult, stake = value*f.share;
  const tax = f.taxRate*Math.max(0,stake-f.cost), fee = f.feePct*stake;
  const net = stake-tax-fee, up = net*f.upPct, earn = net-up;
  const sale = up*Math.pow(1+sc.nom,Math.max(0,stopYear-f.saleYear)) + earn*Math.pow(1+sc.nom,Math.max(0,stopYear-f.saleYear-f.delay));
  const totNom = A+S+sale, totReal = totNom/Math.pow(1+sc.inf,n);
  return {n,N,stopYear,real,af,need,needNom,A,S,stake,tax,fee,net,sale,totNom,totReal,
    gap: totReal-need, gapNoSale: (A+S)/Math.pow(1+sc.inf,n)-need,
    target10Nom: f.target*Math.pow(1+sc.inf,n),
    monthly: af? (f.target-f.illness)/af/12*1000 : 0};
}

function ring(p,col,label,sub,size=92){
  const r=40,c=2*Math.PI*r,o=c*(1-Math.max(0,Math.min(100,p))/100);
  return `<div class="ringw"><svg viewBox="0 0 100 100" width="${size}" height="${size}" role="img" aria-label="${esc(sub)} ${esc(label)}"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="${col}" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${o.toFixed(1)}" transform="rotate(-90 50 50)" class="ringarc"/><text x="50" y="56" text-anchor="middle" class="rt">${label}</text></svg><div class="rsub">${sub}</div></div>`;
}
function flow(items){return `<div class="flow">${items.map(i=>`<div class="chev ${i.state||''}"><b>${esc(i.title)}</b><span>${esc(i.sub||'')}</span></div>`).join('')}</div>`;}
function radar(vals){
  const cx=160,cy=150,R=92,n=vals.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+R*v/100*Math.cos(a),cy+R*v/100*Math.sin(a)];};
  let g='';
  [25,50,75,100].forEach(l=>{g+=`<polygon points="${vals.map((_,i)=>pt(i,l).map(x=>x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;});
  vals.forEach(([f,v],i)=>{const [x,y]=pt(i,100),[lx,ly]=pt(i,125);g+=`<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)"/><text x="${lx.toFixed(1)}" y="${(ly+4).toFixed(1)}" text-anchor="middle" class="rl" fill="${COL[f]}">${f}</text>`;});
  const poly=vals.map(([,v],i)=>pt(i,Math.max(v,3)).map(x=>x.toFixed(1)).join(',')).join(' ');
  g+=`<polygon points="${poly}" fill="rgba(31,95,139,.25)" stroke="#1f5f8b" stroke-width="2"/>`;
  vals.forEach(([f,v],i)=>{const [x,y]=pt(i,Math.max(v,3));g+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${COL[f]}"/>`;});
  return `<svg viewBox="0 0 320 300" width="100%" style="max-width:340px" role="img" aria-label="Biểu đồ radar tiến độ 7T">${g}</svg>`;
}

function hero(){

  const P=[[40,200],[250,225],[380,50],[760,85]];
  const bez=t=>{const u=1-t;return [0,1].map(k=>u*u*u*P[0][k]+3*u*u*t*P[1][k]+3*u*t*t*P[2][k]+t*t*t*P[3][k]);};
  const tOf=d=>Math.max(0,Math.min(1,(yf(d)-y0)/(y1-y0)));
  const ms=data.known.filter(k=>k.date&&k.date>='2027-12-01').sort((a,b)=>a.date<b.date?-1:1);

  ms.forEach((k,i)=>{const [x,y]=bez(tOf(new Date(k.date+'T00:00:00')));const up=i%2===0;const ty=up?y-30:y+34;

   <path d="M${P[0]} C${P[1]} ${P[2]} ${P[3]}" fill="none" stroke="#fff" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
   ${flags}
   <circle cx="${nx}" cy="${ny}" r="14" fill="#fff" opacity=".35" class="pulse"/><circle cx="${nx}" cy="${ny}" r="7" fill="#fff" stroke="#e4572e" stroke-width="3"/>
   <text x="${nx-12}" y="${ny-18}" text-anchor="end" class="hl">Hôm nay</text>

}

  const W=1100,H=230,x0=50,x1=W-50, a=new Date('2026-01-01'), b=new Date('2043-01-01');
  const X=d=>x0+(new Date(d)-a)/(b-a)*(x1-x0), Y=118;
  let s=`<line x1="${x0}" y1="${Y}" x2="${x1}" y2="${Y}" stroke="var(--line)" stroke-width="6" stroke-linecap="round"/>`;
  for(let y=2026;y<=2042;y++){const x=X(y+'-01-01');s+=`<line x1="${x}" y1="${Y-6}" x2="${x}" y2="${Y+6}" stroke="var(--mut)"/>${y%2===0?`<text x="${x}" y="${Y+24}" text-anchor="middle">${y}</text>`:''}`;}
  const nowX=X(iso(new Date()));
  s+=`<rect x="${x0}" y="${Y-3}" width="${Math.max(0,nowX-x0)}" height="6" rx="3" fill="var(--accfill)"/>`;
  const items=data.known.filter(k=>k.date&&k.date>='2027-12-01').sort((p,q)=>p.date<q.date?-1:1);
  items.forEach((k,i)=>{const x=X(k.date);const up=i%2===0;const ty=up?Y-58:Y+62;const gate=/Cổng/.test(k.title);
    s+=`<line x1="${x}" y1="${Y}" x2="${x}" y2="${up?Y-40:Y+44}" stroke="var(--mut)" stroke-dasharray="3 3"/>`;
    s+=gate?`<polygon points="${x},${Y-11} ${x+11},${Y} ${x},${Y+11} ${x-11},${Y}" fill="#f08a24" stroke="var(--card)" stroke-width="2"/>`:`<circle cx="${x}" cy="${Y}" r="8" fill="#1b998b" stroke="var(--card)" stroke-width="2"/>`;
    s+=`<text x="${x}" y="${ty}" text-anchor="middle" class="tl">${esc(SHORT(k))}</text><text x="${x}" y="${ty+14}" text-anchor="middle">${esc(k.date.slice(0,7))}</text>`;});
  s+=`<line x1="${nowX}" y1="${Y-34}" x2="${nowX}" y2="${Y+34}" stroke="#e4572e" stroke-width="2"/><circle cx="${nowX}" cy="${Y}" r="6" fill="#e4572e" class="pulse"/><text x="${nowX}" y="${Y-40}" text-anchor="middle" fill="#e4572e" class="tl">Hôm nay</text>`;
  return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:760px" role="img" aria-label="Đường thời gian 2026 đến 2042">${s}</svg></div>`;
}

function cycleSVG(){
  const cx=230,cy=190,R=125,n=data.steps.length, C={todo:'#9aa0a6',doing:'#f0a020',done:'#2e9d57'};
  const ang=i=>-Math.PI/2+i*2*Math.PI/n, P=i=>[cx+R*Math.cos(ang(i)),cy+R*Math.sin(ang(i))];
  let s=`<defs><marker id="arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="var(--mut)" stroke-width="2"/></marker></defs>`;
  for(let i=0;i<n;i++){const a1=ang(i)+0.30,a2=ang(i+1)-0.30;const x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1),x2=cx+R*Math.cos(a2),y2=cy+R*Math.sin(a2);
    s+=`<path d="M${x1.toFixed(1)},${y1.toFixed(1)} A${R},${R} 0 0 1 ${x2.toFixed(1)},${y2.toFixed(1)}" fill="none" stroke="var(--mut)" stroke-width="2" marker-end="url(#arw)"/>`;}
  data.steps.forEach((st,i)=>{const [x,y]=P(i);const lx=cx+(R+52)*Math.cos(ang(i)),ly=cy+(R+52)*Math.sin(ang(i));const an=Math.abs(Math.cos(ang(i)))<0.2?'middle':(Math.cos(ang(i))>0?'start':'end');const lxx=an==='middle'?lx:(Math.cos(ang(i))>0?x+34:x-34);
    const parts=st.name.split(' và ');
    s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="26" fill="${C[st.status]||C.todo}" stroke="var(--card)" stroke-width="3"/><text x="${x.toFixed(1)}" y="${(y+7).toFixed(1)}" text-anchor="middle" class="cn">${i+1}</text>`;
    const ty=an==='middle'?(Math.sin(ang(i))<0?y-38:y+46):y-2;
    parts.forEach((p,k)=>{s+=`<text x="${lxx.toFixed(1)}" y="${(ty+k*14).toFixed(1)}" text-anchor="${an}" class="cl">${esc(p)}${k<parts.length-1?' và':''}</text>`;});});
  s+=`<text x="${cx}" y="${cy-4}" text-anchor="middle" class="cc">7 Hóa</text><text x="${cx}" y="${cy+16}" text-anchor="middle">vòng lặp liên tục</text>`;
  return `<svg viewBox="-40 0 540 390" width="100%" style="max-width:560px" role="img" aria-label="Vòng 7 Hóa">${s}</svg>`;
}

   <div class="row">${fld('year','Năm hiện tại')}${fld('stopAge','Tuổi dừng làm việc')}${fld('planAge','Lập kế hoạch tới tuổi')}${fld('assets','Tài sản ngoài công ty')}${fld('save','Tiết kiệm thêm mỗi năm (danh nghĩa)')}${fld('spend','Chi tiêu gia đình mỗi năm (tiền hôm nay)')}${fld('spendAfter','Hệ số chi tiêu sau dừng')}${fld('illness','Dự phòng bệnh tật (tiền hôm nay)')}${fld('target','Mức "đủ" anh nêu')}</div>
   <div class="row">${fld('profit','Lợi nhuận ròng INNO FIRE mỗi năm')}${fld('share','Tỷ lệ cổ phần (0–1)')}${fld('cost','Giá vốn phần cổ phần')}${fld('saleYear','Năm bán')}${fld('upPct','Tỷ lệ nhận ngay (0–1)')}${fld('delay','Năm chờ earnout')}${fld('taxRate','Thuế suất lãi chuyển nhượng')}${fld('feePct','Chi phí cố vấn (0–1)')}</div></div>
  <div class="card">${h2i('scale','Ba kịch bản','#3a86c8')}<div class="tw"><table><tr><th></th><th>Thận trọng</th><th>Cơ sở</th><th>Lạc quan</th></tr>
   ${scIn('mult','Bội số lợi nhuận khi bán','0.5')}${scIn('inf','Lạm phát (0.04 = 4%)','0.005')}${scIn('nom','Lãi danh nghĩa (0.059 = 5,9%)','0.005')}${scIn('spendMult','Nhân hệ số chi tiêu','0.05')}
   ${rowF('Lãi thực',r=>fmt(r.real*100,2)+'%')}
   ${rowF('<b>Vốn cần (tiền hôm nay)</b>',r=>'<b>'+fmt(r.need)+'</b>')}
   ${rowF('Vốn cần (tiền danh nghĩa năm dừng)',r=>fmt(r.needNom))}
   ${rowF('Tiền ròng bán công ty (danh nghĩa)',r=>fmt(r.net))}
   ${rowF('Tổng tài sản dự kiến (tiền hôm nay)',r=>fmt(r.totReal))}
   ${rowF('<b>Chênh lệch (tiền hôm nay)</b>',r=>`<b class="${r.gap>=0?'ok':'bad'}">${fmt(r.gap)} ${r.gap>=0?'(đủ)':'(thiếu)'}</b>`)}
   ${rowF('Chênh lệch nếu không bán công ty',r=>`<span class="${r.gapNoSale>=0?'ok':'bad'}">${fmt(r.gapNoSale)}</span>`)}
   ${rowF('Mức đủ anh nêu, quy ra tiền năm dừng',r=>fmt(r.target10Nom))}
   ${rowF('Chi tiêu tháng mức đủ cho phép (triệu)',r=>fmt(r.monthly,0))}
  </table></div><p class="muted">Cùng công thức với file Excel Mo_hinh_tai_chinh_thoat_von.xlsx. Giới hạn: tiết kiệm cố định theo số danh nghĩa; chưa tính thuế lãi tiết kiệm, lương hưu BHXH, học phí con; dự phòng bệnh tật gộp một lần; thuế bán công ty áp một lần.</p></div>
  <div class="card">${h2i('coin','Vốn cần theo chi tiêu và lãi thực (tỷ đồng, tiền hôm nay, '+N+' năm chi)','#5c9c2e')}<div class="tw"><table><tr><th>Chi tiêu/năm \\ Lãi thực</th>${rates.map(r=>`<th>${r*100}%</th>`).join('')}</tr>${sens.map(s=>`<tr><td>${s}</td>${rates.map(r=>`<td>${fmt(s*annuity(r,N))}</td>`).join('')}</tr>`).join('')}</table></div></div>`;
}
function viewMo(){
  const dn=data.open.filter(o=>o.done).length;
  return `<div class="card">${h2i('list','Việc còn mở cần anh chốt ('+dn+'/'+data.open.length+')','#7b5ea7')}<div class="bar" style="margin-bottom:8px"><i style="width:${data.open.length?dn/data.open.length*100:0}%;background:#7b5ea7"></i></div>${data.open.map((o,i)=>`<div class="row"><label><input type="checkbox" data-type="bool" data-path="open.${i}.done" ${o.done?'checked':''}> <span style="${o.done?'text-decoration:line-through;color:var(--mut)':''}">${esc(o.text)}</span></label><button class="btn sm del" data-act="del" data-list="open" data-i="${i}">${ic('trash',14)}</button></div>`).join('')}
  <div class="row"><input type="text" id="newopen" style="flex:1;min-width:200px" placeholder="Thêm việc mới"><button class="btn" data-act="addopen">${ic('plus',14)} Thêm</button></div></div>`;
}
const VIEWS={tong:viewTong,muctieu:viewMuctieu,tuan:viewTuan,lotrinh:viewLotrinh,innofire:viewInno,tiensi:viewTiensi,taichinh:viewTaichinh,mo:viewMo};
const TABIC={tong:'home',muctieu:'target',tuan:'pulse',lotrinh:'flag',innofire:'building',tiensi:'cap',taichinh:'coin',mo:'list'};
function render(){
  document.getElementById('nav').innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${ic(TABIC[k],16)}<span>${l}</span></button>`).join('');
  document.getElementById('main').innerHTML=(VIEWS[tab]||viewTong)();
  paintSave(); labelTables();
}

/* ---------- events ---------- */
function newItem(list){
  const t={
    goals:()=>({id:uid(),factor:'Tiến',title:'',metric:'',baseline:'',target:'',due:'',status:'todo',progress:0,note:''}),
    known:()=>({date:'',title:'',note:''}),
    'phd.milestones':()=>({title:'',date:'',status:'todo',note:''})}[list];
  return t();
}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.tab){ tab=t.dataset.tab; localStorage.setItem('thieu_tab',tab); render(); return; }
  const a=t.dataset.act; if(!a) return;
  const dm=t.closest('details.dm'); if(dm) dm.removeAttribute('open');
  if(a==='pickdir'){ await pickDir(); return; }
  if(a==='theme'){ const r=document.documentElement; const cur=r.dataset.theme|| (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'); r.dataset.theme=cur==='dark'?'light':'dark'; return; }
  if(a==='export' && NATIVE && NP('Share') && NP('Filesystem')){
    try{ const nm='Thieu_data_'+iso(new Date())+'.json'; const r=await NP('Filesystem').writeFile({path:nm,data:JSON.stringify(data,null,2),directory:'CACHE',encoding:'utf8'}); await NP('Share').share({title:'Sao lưu kế hoạch Thiệu',files:[r.uri],dialogTitle:'Lưu hoặc gửi file sao lưu'}); }
    catch(err){ if(!/cancel/i.test(String(err&&err.message))) alert('Không chia sẻ được: '+(err&&err.message)); }
    return; }
  if(a==='export'){ const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}); const l=document.createElement('a'); l.href=URL.createObjectURL(b); l.download='data.json'; l.click(); setTimeout(()=>URL.revokeObjectURL(l.href),1000); return; }
  if(a==='import'){ const i=document.createElement('input'); i.type='file'; i.accept='.json,application/json'; i.onchange=async()=>{ try{ const tx=await i.files[0].text(); data=normalize(JSON.parse(tx)); await saveNow(); render(); }catch(err){ alert('File JSON không hợp lệ: '+err.message); } }; i.click(); return; }
  if(a==='add'){ getPath(data,t.dataset.list).push(newItem(t.dataset.list)); }
  else if(a==='del'){ const L=getPath(data,t.dataset.list); const i=+t.dataset.i; if(confirm('Xóa dòng này?')) L.splice(i,1); else return; }
  else if(a==='addweek'){ const wk=mondayOf(new Date()); if(!data.weekly.some(w=>w.week===wk)) data.weekly.push({week:wk,blockDays:0,familyH:0,trainH:0,sleepH:0,rhr:0,alcFree:0,note:''}); }
  else if(a==='addtransfer'){ data.transfer.push({date:iso(new Date()),decisions:0,ownHoursPct:0,ownRevPct:0,absentDays:0,lateProjects:0,complaints:0,note:''}); }
  else if(a==='addopen'){ const v=document.getElementById('newopen').value.trim(); if(!v) return; data.open.push({text:v,done:false}); }
  scheduleSave(); render();
});
document.addEventListener('change',e=>{
  const el=e.target; const p=el.dataset&&el.dataset.path; if(!p) return;
  let v = el.dataset.type==='bool' ? el.checked : el.dataset.type==='number' ? num(el.value) : el.value;
  if(p==='phd.enrollYear' && !v) v=null;
  setPath(data,p,v);
  if(el.dataset.fin) data.finance.isExample=false;
  scheduleSave();
  const rerender = el.dataset.fin || /\.(status|factor|progress|week|enrollYear|type)$/.test(p) || el.dataset.type==='bool' || p.startsWith('gates') || p.startsWith('known');
  if(rerender){ const y=window.scrollY; render(); window.scrollTo(0,y); }
});
window.addEventListener('beforeunload',()=>{ try{ localStorage.setItem(LS_KEY,JSON.stringify(data)); }catch(e){} });
init();
</script>
